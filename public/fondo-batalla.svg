<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cueva" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05080c"/>
      <stop offset="0.42" stop-color="#0d141b"/>
      <stop offset="0.72" stop-color="#101820"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <radialGradient id="resplandorSup" cx="0.5" cy="0.06" r="0.55">
      <stop offset="0" stop-color="#40665a" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#22332e" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232d33"/>
      <stop offset="0.45" stop-color="#141a20"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <radialGradient id="reflejo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#78969f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#78969f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#cueva)"/>
  <rect width="1600" height="900" fill="url(#resplandorSup)"/>

  <!-- Paredes laterales orgánicas -->
  <path d="M0,0 H240 C200,140 220,260 150,380 C100,470 130,600 80,700 L0,760 Z" fill="#080d12" opacity="0.9"/>
  <path d="M1600,0 H1360 C1400,140 1380,260 1450,380 C1500,470 1470,600 1520,700 L1600,760 Z" fill="#080d12" opacity="0.9"/>
  <path d="M0,0 H150 C130,180 170,300 110,450 C80,540 100,640 60,720 L0,760 Z" fill="#0e151c" opacity="0.85"/>
  <path d="M1600,0 H1450 C1470,180 1430,300 1490,450 C1520,540 1500,640 1540,720 L1600,760 Z" fill="#0e151c" opacity="0.85"/>

  <!-- Estalactitas superiores -->
  <g fill="#060a0e" opacity="0.95">
    <path d="M300,0 L360,0 L345,150 L325,230 L310,140 Z"/>
    <path d="M520,0 L600,0 L585,110 L560,220 L535,120 Z"/>
    <path d="M760,0 L800,0 L795,90 L780,160 L765,90 Z"/>
    <path d="M1000,0 L1080,0 L1060,130 L1035,230 L1015,120 Z"/>
    <path d="M1240,0 L1300,0 L1290,120 L1272,200 L1258,110 Z"/>
  </g>
  <g fill="#131c23" opacity="0.9">
    <path d="M400,0 L450,0 L440,100 L425,170 L412,100 Z"/>
    <path d="M880,0 L940,0 L928,120 L910,200 L895,110 Z"/>
    <path d="M1140,0 L1180,0 L1174,90 L1162,150 L1152,90 Z"/>
  </g>

  <!-- Costillas orgánicas de la cueva -->
  <g fill="none" stroke="#1c2831" stroke-width="26" stroke-linecap="round" opacity="0.55">
    <path d="M180,120 C260,260 240,420 190,560"/>
    <path d="M1420,120 C1340,260 1360,420 1410,560"/>
    <path d="M260,60 C330,220 320,400 270,560"/>
    <path d="M1340,60 C1270,220 1280,400 1330,560"/>
  </g>
  <g fill="none" stroke="#2b3d44" stroke-width="8" stroke-linecap="round" opacity="0.4">
    <path d="M180,120 C260,260 240,420 190,560"/>
    <path d="M1420,120 C1340,260 1360,420 1410,560"/>
  </g>

  <!-- Rocas del fondo -->
  <g fill="#0c1218" opacity="0.9">
    <ellipse cx="480" cy="640" rx="150" ry="70"/>
    <ellipse cx="1150" cy="650" rx="180" ry="80"/>
    <ellipse cx="800" cy="670" rx="120" ry="55"/>
  </g>
  <g fill="#182228" opacity="0.7">
    <ellipse cx="480" cy="625" rx="110" ry="45"/>
    <ellipse cx="1150" cy="632" rx="135" ry="52"/>
  </g>

  <!-- Suelo -->
  <rect y="660" width="1600" height="240" fill="url(#suelo)"/>
  <ellipse cx="800" cy="720" rx="620" ry="70" fill="url(#reflejo)"/>
  <ellipse cx="400" cy="800" rx="300" ry="34" fill="#04070a" opacity="0.5"/>
  <ellipse cx="1200" cy="805" rx="340" ry="36" fill="#04070a" opacity="0.5"/>
  <g stroke="#2e3d45" stroke-width="3" opacity="0.35">
    <path d="M0,740 C400,720 1200,720 1600,745"/>
    <path d="M0,790 C400,770 1200,770 1600,795"/>
  </g>

  <!-- Partículas de polvo -->
  <g fill="#9fd8cf" opacity="0.35">
    <circle cx="350" cy="300" r="3"/>
    <circle cx="700" cy="220" r="2.4"/>
    <circle cx="1050" cy="330" r="3"/>
    <circle cx="1250" cy="240" r="2"/>
    <circle cx="550" cy="450" r="2"/>
    <circle cx="900" cy="470" r="2.6"/>
